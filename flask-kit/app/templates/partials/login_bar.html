<div class="login-bar bg-light p-2 mb-2 rounded border">
    <div class="row m-0 justify-content-end align-items-center">
        {% if current_user and current_user.is_authenticated %}
            <div class="user-info mr-3">
                <i class="fas fa-user-circle"></i> 
                <strong>{{ current_user.name }}</strong> 
                {% if current_user.email %}
                    <span class="text-muted d-none d-sm-inline">({{ current_user.email }})</span>
                {% endif %}
            </div>
            <div class="logout-action">
                <a class="btn btn-outline-danger btn-sm" href="{{ url_for('auth.logout') }}">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </a>
            </div>
        {% else %}
            <div class="login-action">
                <span class="text-muted mr-2 d-none d-sm-inline">Não autenticado</span>
                <a class="btn btn-outline-primary btn-sm" href="{{ url_for('auth.login') }}">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </a>
            </div>
        {% endif %}
    </div>
</div>
